<svg width="880" height="90" viewBox="0 0 880 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #181818; stroke: #2A2A2A; stroke-width: 1; rx: 6px; }
    .header { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #6E7681; letter-spacing: 0.08em; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 10px; }
    .step-past { fill: #141414; stroke: #262626; stroke-width: 1; rx: 4px; }
    .text-past { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #666666; text-anchor: middle; }
    .step-active { fill: #162438; stroke: #4FA3FF; stroke-width: 1; rx: 4px; }
    .text-active { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #4FA3FF; font-weight: 600; text-anchor: middle; }
    .arrow-past { stroke: #333333; stroke-width: 1; }
    .arrow-active { stroke: #4FA3FF; stroke-width: 1.5; }
  </style>

  <!-- Background -->
  <rect x="0.5" y="0.5" width="879" height="89" class="bg" />

  <!-- Top Bar -->
  <text x="16" y="22" class="header">ENGINEERING_JOURNEY // EVOLUTION OF CURIOSITY</text>
  <line x1="16" y1="30" x2="864" y2="30" stroke="#262626" stroke-width="1" />

  <!-- Journey Pipeline -->
  <g transform="translate(14, 42)">
    <!-- 1. Curiosity -->
    <rect x="0" y="0" width="70" height="30" class="step-past" />
    <text x="35" y="19" class="text-past">Curiosity</text>

    <path d="M 70 15 L 80 15" class="arrow-past" />
    <polygon points="80,12 85,15 80,18" fill="#333333" />

    <!-- 2. Automation -->
    <rect x="85" y="0" width="78" height="30" class="step-past" />
    <text x="124" y="19" class="text-past">Automation</text>

    <path d="M 163 15 L 173 15" class="arrow-past" />
    <polygon points="173,12 178,15 173,18" fill="#333333" />

    <!-- 3. Backend -->
    <rect x="178" y="0" width="65" height="30" class="step-past" />
    <text x="210.5" y="19" class="text-past">Backend</text>

    <path d="M 243 15 L 253 15" class="arrow-past" />
    <polygon points="253,12 258,15 253,18" fill="#333333" />

    <!-- 4. ML -->
    <rect x="258" y="0" width="82" height="30" class="step-past" />
    <text x="299" y="19" class="text-past">Machine Lng</text>

    <path d="M 340 15 L 350 15" class="arrow-past" />
    <polygon points="350,12 355,15 350,18" fill="#333333" />

    <!-- 5. Dev Tools -->
    <rect x="355" y="0" width="75" height="30" class="step-past" />
    <text x="392.5" y="19" class="text-past">Dev Tools</text>

    <path d="M 430 15 L 440 15" class="arrow-past" />
    <polygon points="440,12 445,15 440,18" fill="#333333" />

    <!-- 6. Systems -->
    <rect x="445" y="0" width="96" height="30" class="step-active" />
    <text x="493" y="19" class="text-active">Systems Prog</text>

    <path d="M 541 15 L 551 15" class="arrow-active" />
    <polygon points="551,12 556,15 551,18" fill="#4FA3FF" />

    <!-- 7. Rendering -->
    <rect x="556" y="0" width="78" height="30" class="step-active" />
    <text x="595" y="19" class="text-active">Rendering</text>

    <path d="M 634 15 L 644 15" class="arrow-active" />
    <polygon points="644,12 649,15 644,18" fill="#4FA3FF" />

    <!-- 8. Browser Engine -->
    <rect x="649" y="0" width="118" height="30" class="step-active" fill="#1C324D" stroke="#4FA3FF" stroke-width="1.5" />
    <text x="708" y="19" class="text-active" font-size="11">Browser Engine</text>

    <path d="M 767 15 L 777 15" class="arrow-active" />
    <polygon points="777,12 782,15 777,18" fill="#4FA3FF" />

    <!-- 9. ? -->
    <rect x="782" y="0" width="44" height="30" class="step-active" stroke-dasharray="3 3" fill="#111111" />
    <text x="804" y="19" class="text-active" fill="#F5F5F5">?</text>
  </g>
</svg>
