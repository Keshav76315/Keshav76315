<svg width="880" height="240" viewBox="0 0 880 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #181818; stroke: #2A2A2A; stroke-width: 1; rx: 8px; }
    .header { font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; fill: #F5F5F5; letter-spacing: -0.01em; }
    .sub { font-family: 'Inter', sans-serif; font-size: 13px; fill: #A0A0A0; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #888888; }
    .mono-bold { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #F5F5F5; font-weight: 600; }
    .card { fill: #121212; stroke: #262626; stroke-width: 1; rx: 6px; }
    .tag { fill: #222222; stroke: #2A2A2A; stroke-width: 1; rx: 4px; }
  </style>

  <!-- Container -->
  <rect x="0.5" y="0.5" width="879" height="239" class="bg" />

  <!-- Top Accent Line -->
  <path d="M 8 1 L 872 1" stroke="#4FA3FF" stroke-width="2" stroke-linecap="round" />

  <!-- Content Left -->
  <g transform="translate(32, 28)">
    <!-- Header & Badge -->
    <text x="0" y="22" class="header">ASTERIA ENGINE</text>
    <rect x="175" y="6" width="56" height="20" class="tag" />
    <text x="186" y="20" class="mono" fill="#4FA3FF">RUST</text>

    <text x="0" y="46" class="sub">A lightweight, experimental browser engine built from first principles in Rust.</text>
    <text x="0" y="64" class="sub">Designed to explore parallel rendering, memory safety, and custom GPU compositor pipelines.</text>

    <!-- Key Spec Grid -->
    <g transform="translate(0, 84)">
      <!-- Spec 1 -->
      <rect x="0" y="0" width="155" height="74" class="card" />
      <text x="12" y="22" class="mono" fill="#666666">PARSER &amp; DOM</text>
      <text x="12" y="42" class="mono-bold">Custom HTML5</text>
      <text x="12" y="58" class="mono" fill="#3FB950">✓ Spec Compliant</text>

      <!-- Spec 2 -->
      <rect x="165" y="0" width="155" height="74" class="card" />
      <text x="177" y="22" class="mono" fill="#666666">STYLE RESOLVER</text>
      <text x="177" y="42" class="mono-bold">CSS Engine</text>
      <text x="177" y="58" class="mono" fill="#3FB950">✓ Cascade Match</text>

      <!-- Spec 3 -->
      <rect x="330" y="0" width="155" height="74" class="card" />
      <text x="342" y="22" class="mono" fill="#666666">LAYOUT ENGINE</text>
      <text x="342" y="42" class="mono-bold">Box &amp; Flex Solver</text>
      <text x="342" y="58" class="mono" fill="#3FB950">✓ Multi-pass Sizing</text>
    </g>
  </g>

  <!-- Visual Right: Live Renderer Status Card -->
  <g transform="translate(540, 28)">
    <rect x="0" y="0" width="308" height="184" class="card" />
    
    <!-- Mini Window Bar -->
    <rect x="0" y="0" width="308" height="26" fill="#181818" rx="6" />
    <line x1="0" y1="26" x2="308" y2="26" stroke="#262626" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#FF5F56" />
    <circle cx="26" cy="13" r="3.5" fill="#FFBD2E" />
    <circle cx="38" cy="13" r="3.5" fill="#27C93F" />
    <text x="54" y="17" class="mono" fill="#6E7681">asteria_viewport 800x600</text>

    <!-- Visual Canvas Mock -->
    <rect x="14" y="40" width="280" height="100" fill="#0D0D0D" stroke="#222222" stroke-width="1" rx="4" />
    
    <!-- Rendered DOM Element Mocks in Visual Canvas -->
    <rect x="26" y="52" width="256" height="22" fill="#162438" stroke="#4FA3FF" stroke-width="1" rx="3" />
    <text x="36" y="67" class="mono" fill="#4FA3FF" font-size="10">&lt;header class="viewport-title"&gt;</text>

    <rect x="26" y="82" width="120" height="44" fill="#181818" stroke="#333333" stroke-width="1" rx="3" />
    <text x="34" y="98" class="mono" fill="#3FB950" font-size="9">&lt;div id="nav"&gt;</text>
    <text x="34" y="114" class="mono" fill="#888888" font-size="9">Flex: Row</text>

    <rect x="154" y="82" width="128" height="44" fill="#181818" stroke="#333333" stroke-width="1" rx="3" />
    <text x="162" y="98" class="mono" fill="#4FA3FF" font-size="9">&lt;main id="content"&gt;</text>
    <text x="162" y="114" class="mono" fill="#888888" font-size="9">Render Pass: GPU</text>

    <!-- Bottom Status Line -->
    <rect x="14" y="148" width="280" height="24" fill="#141414" stroke="#222222" stroke-width="1" rx="3" />
    <text x="24" y="164" class="mono" fill="#3FB950" font-size="10">● RASTER_SUCCESS</text>
    <text x="175" y="164" class="mono" fill="#888888" font-size="10">Target: <tspan fill="#F5F5F5">WGPU Surface</tspan></text>
  </g>
</svg>
