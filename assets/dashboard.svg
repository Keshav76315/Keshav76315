<svg width="880" height="260" viewBox="0 0 880 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #181818; stroke: #2A2A2A; stroke-width: 1; rx: 6px; }
    .header-bar { fill: #141414; stroke: #2A2A2A; stroke-width: 1; rx: 5px; }
    .header-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #6E7681; font-weight: 600; letter-spacing: 0.08em; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 10px; }
    .mono-sm { font-family: 'JetBrains Mono', monospace; font-size: 9px; }
    .mono-bold { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
    .title-lg { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; fill: #F5F5F5; }
    .body-txt { font-family: 'Inter', sans-serif; font-size: 11px; fill: #C0C0C0; }
    .node-done { fill: #141E16; stroke: #234E2B; stroke-width: 1; rx: 5px; }
    .text-done { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #3FB950; font-weight: 600; text-anchor: middle; }
    .node-active { fill: #162438; stroke: #4FA3FF; stroke-width: 1.5; rx: 5px; }
    .text-active { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #4FA3FF; font-weight: 600; text-anchor: middle; }
    .node-planned { fill: #141414; stroke: #333333; stroke-width: 1; stroke-dasharray: 3 3; rx: 5px; }
    .text-planned { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #666666; text-anchor: middle; }
    .arrow-done { stroke: #3FB950; stroke-width: 1.5; }
    .arrow-planned { stroke: #333333; stroke-width: 1.5; stroke-dasharray: 2 2; }
    .badge { fill: #222222; stroke: #2A2A2A; stroke-width: 1; rx: 3px; }
    .chip { fill: #1E1E1E; stroke: #2E2E2E; stroke-width: 1; rx: 3px; }
  </style>

  <!-- ================= LEFT PANEL: CURRENT BUILD ================= -->
  <g transform="translate(0, 0)">
    <rect x="0.5" y="0.5" width="280" height="259" class="bg" />

    <!-- Header -->
    <rect x="1" y="1" width="279" height="28" class="header-bar" />
    <line x1="0" y1="29" x2="281" y2="29" stroke="#2A2A2A" stroke-width="1" />
    <text x="12" y="19" class="header-text">⚡ CURRENT_BUILD</text>

    <!-- Content Stack -->
    <g transform="translate(14, 42)">
      <!-- Primary Project -->
      <text x="0" y="10" class="mono" fill="#888888">PRIMARY PROJECT</text>
      <text x="0" y="28" class="title-lg">Asteria</text>
      <text x="65" y="28" class="mono" fill="#4FA3FF">Browser Engine (Rust)</text>

      <!-- Current Focus -->
      <text x="0" y="52" class="mono" fill="#888888">CURRENT FOCUS</text>
      <text x="0" y="68" class="body-txt">• Parallel Rendering</text>
      <text x="0" y="82" class="body-txt">• Systems Memory Safety</text>
      <text x="0" y="96" class="body-txt">• WGPU Texture Compositing</text>

      <!-- Latest Milestone -->
      <text x="0" y="120" class="mono" fill="#888888">LATEST MILESTONE</text>
      <text x="0" y="136" class="mono-bold" fill="#3FB950">✓ Display List Scrolling</text>

      <!-- Next Goal -->
      <text x="0" y="160" class="mono" fill="#888888">NEXT GOAL</text>
      <text x="0" y="176" class="mono-bold" fill="#4FA3FF">🎯 JavaScript AST &amp; Runtime</text>

      <!-- Tech Chips -->
      <g transform="translate(0, 188)">
        <rect x="0" y="0" width="60" height="18" class="chip" />
        <text x="8" y="12" class="mono-sm" fill="#A0A0A0">Rust</text>

        <rect x="66" y="0" width="60" height="18" class="chip" />
        <text x="74" y="12" class="mono-sm" fill="#A0A0A0">WGPU</text>

        <rect x="132" y="0" width="62" height="18" class="chip" />
        <text x="140" y="12" class="mono-sm" fill="#A0A0A0">Browser</text>

        <rect x="200" y="0" width="52" height="18" class="chip" />
        <text x="208" y="12" class="mono-sm" fill="#A0A0A0">Systems</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: RENDERING PIPELINE ================= -->
  <g transform="translate(290, 0)">
    <rect x="0.5" y="0.5" width="589" height="259" class="bg" />

    <!-- Header Bar -->
    <rect x="1" y="1" width="588" height="28" class="header-bar" />
    <line x1="0" y1="29" x2="590" y2="29" stroke="#2A2A2A" stroke-width="1" />
    <text x="14" y="19" class="header-text">ASTERIA_RENDERING_PIPELINE</text>
    
    <rect x="475" y="6" width="102" height="18" class="badge" />
    <text x="483" y="18" class="mono" fill="#4FA3FF">Pipeline v0.4</text>

    <!-- Section 1 Title: Core Pipeline (Implemented) -->
    <text x="14" y="48" class="mono" fill="#888888">STAGE 1: CORE RENDERING PIPELINE (HTML ➔ PIXELS)</text>

    <!-- Row 1 Nodes: Core Pipeline -->
    <!-- 1. HTML -->
    <g transform="translate(14, 58)">
      <rect x="0" y="0" width="56" height="34" class="node-done" />
      <text x="28" y="17" class="text-done">HTML</text>
      <text x="28" y="28" class="mono-sm" fill="#2E7D32" text-anchor="middle">✓ Parser</text>
    </g>

    <path d="M 70 75 L 82 75" class="arrow-done" />
    <polygon points="82,72 87,75 82,78" fill="#3FB950" />

    <!-- 2. DOM -->
    <g transform="translate(87, 58)">
      <rect x="0" y="0" width="56" height="34" class="node-done" />
      <text x="28" y="17" class="text-done">DOM</text>
      <text x="28" y="28" class="mono-sm" fill="#2E7D32" text-anchor="middle">✓ Tree</text>
    </g>

    <path d="M 143 75 L 155 75" class="arrow-done" />
    <polygon points="155,72 160,75 155,78" fill="#3FB950" />

    <!-- 3. STYLE -->
    <g transform="translate(160, 58)">
      <rect x="0" y="0" width="60" height="34" class="node-done" />
      <text x="30" y="17" class="text-done">STYLE</text>
      <text x="30" y="28" class="mono-sm" fill="#2E7D32" text-anchor="middle">✓ CSS</text>
    </g>

    <path d="M 220 75 L 232 75" class="arrow-done" />
    <polygon points="232,72 237,75 232,78" fill="#3FB950" />

    <!-- 4. LAYOUT -->
    <g transform="translate(237, 58)">
      <rect x="0" y="0" width="64" height="34" class="node-done" />
      <text x="32" y="17" class="text-done">LAYOUT</text>
      <text x="32" y="28" class="mono-sm" fill="#2E7D32" text-anchor="middle">✓ Flex</text>
    </g>

    <path d="M 301 75 L 313 75" class="arrow-done" />
    <polygon points="313,72 318,75 313,78" fill="#3FB950" />

    <!-- 5. PAINT -->
    <g transform="translate(318, 58)">
      <rect x="0" y="0" width="60" height="34" class="node-done" />
      <text x="30" y="17" class="text-done">PAINT</text>
      <text x="30" y="28" class="mono-sm" fill="#2E7D32" text-anchor="middle">✓ Display</text>
    </g>

    <path d="M 378 75 L 390 75" class="arrow-done" />
    <polygon points="390,72 395,75 390,78" fill="#3FB950" />

    <!-- 6. GPU -->
    <g transform="translate(395, 58)">
      <rect x="0" y="0" width="60" height="34" class="node-done" fill="#182A1B" stroke="#3FB950" />
      <text x="30" y="17" class="text-done">GPU</text>
      <text x="30" y="28" class="mono-sm" fill="#3FB950" text-anchor="middle">✓ WGPU</text>
    </g>

    <path d="M 455 75 L 467 75" class="arrow-done" />
    <polygon points="467,72 472,75 467,78" fill="#3FB950" />

    <!-- 7. PIXELS -->
    <g transform="translate(472, 58)">
      <rect x="0" y="0" width="102" height="34" class="node-active" />
      <text x="51" y="17" class="text-active">PIXELS</text>
      <text x="51" y="28" class="mono-sm" fill="#4FA3FF" text-anchor="middle">⚡ Screen Output</text>
    </g>

    <!-- Section Divider -->
    <line x1="14" y1="110" x2="575" y2="110" stroke="#262626" stroke-width="1" />

    <!-- Section 2 Title: Upcoming Subsystems -->
    <text x="14" y="130" class="mono" fill="#888888">STAGE 2: UPCOMING SUBSYSTEMS &amp; RUNTIME EXTENSIONS</text>

    <!-- Row 2 Nodes: Upcoming Extensions -->
    <!-- JavaScript Runtime (Current Focus) -->
    <g transform="translate(14, 142)">
      <rect x="0" y="0" width="170" height="42" class="node-active" />
      <circle cx="16" cy="21" r="5" fill="#4FA3FF" />
      <text x="28" y="18" class="mono-bold" fill="#F5F5F5">JAVASCRIPT RUNTIME</text>
      <text x="28" y="32" class="mono-sm" fill="#4FA3FF">Focus: V8 / Custom AST</text>
      <rect x="130" y="8" width="32" height="15" rx="2" fill="#1C385E" />
      <text x="146" y="19" class="mono-sm" fill="#4FA3FF" text-anchor="middle">NEXT</text>
    </g>

    <path d="M 184 163 L 202 163" class="arrow-planned" />
    <polygon points="202,160 207,163 202,166" fill="#333333" />

    <!-- Network Engine -->
    <g transform="translate(207, 142)">
      <rect x="0" y="0" width="170" height="42" class="node-planned" />
      <circle cx="16" cy="21" r="4" fill="#555555" />
      <text x="28" y="18" class="mono-bold" fill="#888888">NETWORK PROTOCOL</text>
      <text x="28" y="32" class="mono-sm" fill="#555555">HTTP/2 • TLS • Fetch</text>
      <rect x="130" y="8" width="32" height="15" rx="2" fill="#1F1F1F" />
      <text x="146" y="19" class="mono-sm" fill="#666666" text-anchor="middle">PLAN</text>
    </g>

    <path d="M 377 163 L 395 163" class="arrow-planned" />
    <polygon points="395,160 400,163 395,166" fill="#333333" />

    <!-- Accessibility Tree -->
    <g transform="translate(400, 142)">
      <rect x="0" y="0" width="174" height="42" class="node-planned" />
      <circle cx="16" cy="21" r="4" fill="#555555" />
      <text x="28" y="18" class="mono-bold" fill="#888888">ACCESSIBILITY TREE</text>
      <text x="28" y="32" class="mono-sm" fill="#555555">A11y Node Mapping</text>
      <rect x="134" y="8" width="32" height="15" rx="2" fill="#1F1F1F" />
      <text x="150" y="19" class="mono-sm" fill="#666666" text-anchor="middle">PLAN</text>
    </g>

    <!-- Bottom Legend -->
    <g transform="translate(14, 204)">
      <circle cx="5" cy="5" r="4" fill="#3FB950" />
      <text x="14" y="8" class="mono-sm" fill="#888888">Implemented Stage</text>

      <circle cx="125" cy="5" r="4" fill="#4FA3FF" />
      <text x="134" y="8" class="mono-sm" fill="#888888">Current Focus</text>

      <circle cx="215" cy="5" r="4" fill="#444444" />
      <text x="224" y="8" class="mono-sm" fill="#666666">Upcoming Phase</text>
    </g>
  </g>
</svg>
